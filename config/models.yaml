# IDs de LiteLLM. Se verifican en la Fase 0.

# No pasa por LiteLLM: lo usa el script del golden set con `claude -p`.
golden_set_generator: claude-opus-5-5

# Se elige uno en la Fase 3. Nunca puede estar en `compared_models`.
judge_candidates:
  - opencode_go/kimi-k3
  - opencode_go/deepseek-v4-pro

compared_models:
  - ollama/gemma4:31b-cloud
  - openrouter/nvidia/nemotron-3-ultra-550b-a55b:free
  - opencode_go/glm-5.3-flash
  - opencode_go/mimo-v2.6-flash

# Modelo que responde en el flujo RAG.
answer_model: opencode_go/glm-5.3-flash

# Embeddings en local con Ollama.
embedding_model: ollama/bge-m3
