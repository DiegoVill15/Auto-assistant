[project]
name = "auto-assistant"
version = "0.1.0"
description = "Asistente RAG en español que se auto-evalúa."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "chromadb>=1.5.9",
    "langgraph>=1.2.19",
    "litellm",
    "pyyaml",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[project.scripts]
ingest = "auto_assistant.cli.main:ingest"
ask = "auto_assistant.cli.main:ask"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/auto_assistant"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
