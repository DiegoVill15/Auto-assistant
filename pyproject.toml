[project]
name = "auto-assistant"
version = "0.1.0"
description = "Asistente RAG en español que se auto-evalúa."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = ["litellm", "pyyaml"]

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/auto_assistant"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
